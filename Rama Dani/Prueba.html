<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hola Javi</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			font-family: Arial, sans-serif;
			background: #f5f5f5;
		}

		.marco {
			padding: 24px;
			border: 4px solid #d62828;
			background: white;
		}

		.cuadrado {
			width: 220px;
			height: 220px;
			display: grid;
			place-items: center;
			background: #eeeeee;
			color: #222;
			font-size: 2rem;
			font-weight: bold;
		}
	</style>
</head>
<body>
	<main class="marco">
		<div class="cuadrado">Hola Javi</div>
	</main>
</body>
</html>
